name: Promote to production

# Deploys the version that is on staging (and that QA Wolf tested) to the
# production backend, then moves `main` to it, so `main` always shows what
# production runs. Run it from the Actions tab with "Run workflow".
# Nobody pushes to `main` by hand; only this workflow.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Leave empty to promote what is on staging now. To roll back, enter an
          earlier commit SHA from the staging branch.
        required: false
        default: ""
      skip-qawolf-check:
        description: >-
          Emergency only: promote even without a passing "QA Wolf verdict"
          check (e.g. rolling back to a version from before QA Wolf ran).
        type: boolean
        required: false
        default: false

# Never two production deploys at once
concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  STAGING_API: https://us-central1-showme-staging.cloudfunctions.net/apiv2
  PRODUCTION_API: https://us-central1-showme-backend-789.cloudfunctions.net/apiv2

jobs:
  promote:
    runs-on: ubuntu-24.04
    # The "production" environment (repo Settings > Environments) asks a
    # required reviewer to approve before this job starts
    environment: production
    permissions:
      contents: write # to move the main branch
      checks: read # to read the commit's "QA Wolf verdict" check

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the commit came from staging

      - name: Choose the commit to promote
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
        run: |
          if [ -n "$REQUESTED" ]; then
            sha=$(git rev-parse --verify "$REQUESTED^{commit}")
          else
            sha=$(curl -fsS "$STAGING_API/version" | jq -r .version)
          fi
          # Only code that has been merged to staging (and so was tested there)
          if ! git merge-base --is-ancestor "$sha" origin/staging; then
            echo "::error::$sha is not a commit on staging, refusing to promote it"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Promoting $sha: $(git log -1 --format=%s "$sha")"

      # The quality gate: QA Wolf must have passed this exact commit on staging
      # (the "QA Wolf verdict" check, from main.yml)
      - name: Check QA Wolf passed this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pick.outputs.sha }}
          SKIP: ${{ inputs.skip-qawolf-check }}
        run: |
          url="repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=QA%20Wolf%20verdict"
          passed=$(gh api "$url" --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -gt 0 ]; then
            echo "QA Wolf passed $SHA on staging"
          elif [ "$SKIP" = "true" ]; then
            echo "::warning::Promoting $SHA WITHOUT a passing QA Wolf verdict (skip-qawolf-check was ticked)"
          else
            echo "::error::QA Wolf has not passed $SHA (no successful 'QA Wolf verdict' check). Refusing to promote."
            exit 1
          fi

      # From here on, the files are exactly those of the chosen commit
      - name: Switch to that commit
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: git checkout --detach "$SHA"

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # One more check before real users get it
      - name: Run Tests
        run: npm test

      # Production settings: the real database, the production JWT secret,
      # and no test login secret, so the test login door stays shut
      - name: Write runtime settings (.env) from GitHub secrets
        env:
          DATABASE_ACCESS: ${{ secrets.DATABASE_ACCESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          for name in DATABASE_ACCESS GOOGLE_CLIENT_ID JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              exit 1
            fi
          done
          {
            echo "DATABASE_ACCESS=\"$DATABASE_ACCESS\""
            echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
            echo "APP_VERSION=\"$SHA\""
          } > .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions to Production
        run: npx --yes firebase-tools@15 deploy --only functions --project default --non-interactive

      - name: Check production now runs that commit
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          for attempt in $(seq 1 12); do
            live=$(curl -fsS "$PRODUCTION_API/version" | jq -r .version || true)
            if [ "$live" = "$SHA" ]; then
              echo "Production runs $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report $SHA after deploying"
          exit 1

      # main always matches what production runs (--force allows rollbacks)
      - name: Move main (production) to that commit
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: git push --force origin "$SHA:refs/heads/main"
