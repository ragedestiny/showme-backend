name: Promote to production
# Shown in the list of runs. The commit at the top of a run's page is only the
# version of this workflow file; the run's summary box names the commit that
# is actually being promoted.
run-name: Promote ${{ inputs.commit || 'what staging runs' }} to production

# Deploys the version that is on staging (and that QA Wolf tested) to the
# production backend, then moves `main` to it, so `main` always shows what
# production runs. Run it from the Actions tab with "Run workflow".
# Nobody pushes to `main` by hand; only this workflow.
#
# Two jobs:
#   1. "QA Wolf greenlight" checks, live, that QA Wolf greenlit this exact
#      commit on staging (completed, zero blocking bugs, not replaced)
#   2. "promote" asks for the production approval only after that passes
on:
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Leave empty to promote what is on staging now. To roll back, enter an
          earlier commit SHA from the staging branch.
        required: false
        default: ""
      skip-qawolf-check:
        description: >-
          Emergency only: promote without QA Wolf's greenlight (e.g. rolling
          back to a version QA Wolf never tested).
        type: boolean
        required: false
        default: false

# Never two production deploys at once
concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  STAGING_API: https://us-central1-showme-staging.cloudfunctions.net/apiv2
  PRODUCTION_API: https://us-central1-showme-backend-789.cloudfunctions.net/apiv2

jobs:
  greenlight:
    name: QA Wolf greenlight
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # up to 10 min for staging to catch up + 20 for QA Wolf
    outputs:
      sha: ${{ steps.pick.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the commit came from staging

      # What staging runs (after waiting up to 10 min for it to run the newest
      # staging commit), or the commit typed in; see the script for details
      - name: Choose the commit to promote
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
          VERSION_URL: ${{ env.STAGING_API }}/version
          VERSION_FORMAT: json
        run: bash .github/scripts/choose-commit.sh

      - name: Set Up Node.js
        if: ${{ !inputs.skip-qawolf-check }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Waits (up to 20 minutes) if QA Wolf is still testing the commit
      - name: Check QA Wolf greenlit this commit
        if: ${{ !inputs.skip-qawolf-check }}
        env:
          QAWOLF_API_KEY: ${{ secrets.QAWOLF_API_KEY }}
          SHA: ${{ steps.pick.outputs.sha }}
          WORKSPACE_ID: xoniuprcn2am5nh63rx8fn6cotea # not a secret
          STAGING_ENVIRONMENT_ID: mpfj5fxvb9okt8zi0s7upakaoenv # QA Wolf's Staging
        run: node .github/scripts/qawolf-greenlight.mjs

      - name: Warn that the QA Wolf check was skipped
        if: ${{ inputs.skip-qawolf-check }}
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: echo "::warning::Promoting $SHA WITHOUT QA Wolf's greenlight (skip-qawolf-check was ticked)"

  promote:
    needs: greenlight
    runs-on: ubuntu-24.04
    # The "production" environment (repo Settings > Environments) asks a
    # required reviewer to approve before this job starts
    environment: production
    permissions:
      contents: write # to move the main branch
    env:
      SHA: ${{ needs.greenlight.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the promoted commit must be available

      # From here on, the files are exactly those of the chosen commit
      - name: Switch to that commit
        run: git checkout --detach "$SHA"

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # One more check before real users get it
      - name: Run Tests
        run: npm test

      # Production settings: the real database, the production JWT secret,
      # and no test login secret, so the test login door stays shut
      - name: Write runtime settings (.env) from GitHub secrets
        env:
          DATABASE_ACCESS: ${{ secrets.DATABASE_ACCESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for name in DATABASE_ACCESS GOOGLE_CLIENT_ID JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              exit 1
            fi
          done
          {
            echo "DATABASE_ACCESS=\"$DATABASE_ACCESS\""
            echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
            echo "APP_VERSION=\"$SHA\""
          } > .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions to Production
        run: npx --yes firebase-tools@15 deploy --only functions --project default --non-interactive

      - name: Check production now runs that commit
        run: |
          for attempt in $(seq 1 12); do
            live=$(curl -fsS "$PRODUCTION_API/version" | jq -r .version || true)
            if [ "$live" = "$SHA" ]; then
              echo "Production runs $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report $SHA after deploying"
          exit 1

      # main always matches what production runs (--force allows rollbacks)
      - name: Move main (production) to that commit
        run: |
          git push --force origin "$SHA:refs/heads/main"
          echo "- ✅ Production now runs \`${SHA:0:7}\`, and \`main\` points at it" >> "$GITHUB_STEP_SUMMARY"
