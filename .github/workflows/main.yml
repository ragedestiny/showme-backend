name: Test and Deploy Functions

# Tests run on every pull request and every push to main.
# Only code whose tests pass is deployed:
#   - a pull request deploys to STAGING (practice database, test login on),
#     so backend changes can be tried before merging
#   - a push to main (merging a PR) deploys to PRODUCTION
on:
  push:
    branches:
      - main
  pull_request:
  # Adds a "Run workflow" button (Actions tab) to deploy a branch to staging
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest, so GitHub switching "latest" to a new
    # Ubuntu can't change our setup without us noticing.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in package.json
          cache: npm

      # npm ci installs exactly what package-lock.json lists
      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  deploy_functions:
    needs: test # only runs if every test passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Firebase uploads the .env file as the function's runtime settings;
      # settings in this job's environment alone never reach the server.
      # Stop before deploying if any secret is missing, rather than deploying
      # a backend that can't reach its database.
      - name: Write runtime settings (.env) from GitHub secrets
        env:
          DATABASE_ACCESS: ${{ secrets.DATABASE_ACCESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for name in DATABASE_ACCESS GOOGLE_CLIENT_ID JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              exit 1
            fi
          done
          {
            echo "DATABASE_ACCESS=\"$DATABASE_ACCESS\""
            echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
          } > .env

      # Log in to Google Cloud as the deploy service account (key stored in
      # the FIREBASE_SERVICE_ACCOUNT secret). This replaces the retired
      # `--token` login.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions to Production
        run: npx --yes firebase-tools@15 deploy --only functions --project default --non-interactive

  deploy_staging:
    needs: test # only runs if every test passed
    # Pull requests from this repository, or the "Run workflow" button.
    # Not Dependabot's PRs (GitHub doesn't give them our secrets) or PRs from
    # forks (which must never get our secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    # There is one staging backend: if two PRs push at once, deploy one after
    # the other rather than at the same time
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Staging has its own secrets: a database login that can only reach the
      # practice database (ShowME-dev), its own JWT secret (so a staging login
      # is worthless on production), and the test login secret, which
      # production never gets.
      - name: Write runtime settings (.env) from GitHub secrets
        env:
          DATABASE_ACCESS: ${{ secrets.STAGING_DATABASE_ACCESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          TEST_LOGIN_SECRET: ${{ secrets.TEST_LOGIN_SECRET }}
        run: |
          for name in DATABASE_ACCESS GOOGLE_CLIENT_ID JWT_SECRET TEST_LOGIN_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret for $name is empty or missing"
              exit 1
            fi
          done
          {
            echo "DATABASE_ACCESS=\"$DATABASE_ACCESS\""
            echo "DATABASE_NAME=\"ShowME-dev\""
            echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
            echo "TEST_LOGIN_SECRET=\"$TEST_LOGIN_SECRET\""
          } > .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}

      # "staging" is the project alias defined in .firebaserc.
      # --force lets the deploy set up the cleanup policy for old function
      # images by itself (production's was set by hand), and lets it remove a
      # staging function that no longer exists in the code without asking.
      - name: Deploy Functions to Staging
        run: npx --yes firebase-tools@15 deploy --only functions --project staging --non-interactive --force
