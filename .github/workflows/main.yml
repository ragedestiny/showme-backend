name: Test and Deploy Functions

# Tests run on every pull request and every push to main.
# Deploying only happens on a push to main, and only if the tests pass.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest, so GitHub switching "latest" to a new
    # Ubuntu can't change our setup without us noticing.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with "engines" in package.json
          cache: npm

      # npm ci installs exactly what package-lock.json lists
      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  deploy_functions:
    needs: test # only runs if every test passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Firebase uploads the .env file as the function's runtime settings;
      # settings in this job's environment alone never reach the server.
      # Stop before deploying if any secret is missing, rather than deploying
      # a backend that can't reach its database.
      - name: Write runtime settings (.env) from GitHub secrets
        env:
          DATABASE_ACCESS: ${{ secrets.DATABASE_ACCESS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for name in DATABASE_ACCESS GOOGLE_CLIENT_ID JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is empty or missing"
              exit 1
            fi
          done
          {
            echo "DATABASE_ACCESS=\"$DATABASE_ACCESS\""
            echo "GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\""
            echo "JWT_SECRET=\"$JWT_SECRET\""
          } > .env

      # Log in to Google Cloud as the deploy service account (key stored in
      # the FIREBASE_SERVICE_ACCOUNT secret). This replaces the retired
      # `--token` login.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Functions
        run: npx --yes firebase-tools@15 deploy --only functions --non-interactive
