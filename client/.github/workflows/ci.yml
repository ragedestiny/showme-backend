name: Lint, Test and Build

# Runs the same three checks we run by hand, on every pull request (including
# Dependabot's) and every push to staging (merges) or main (promotions).
# Netlify deploys separately; this only checks the code.
on:
  push:
    branches:
      - staging
      - main
  pull_request:

jobs:
  check:
    # Pinned rather than ubuntu-latest, so GitHub switching "latest" to a new
    # Ubuntu can't change our setup without us noticing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # keep in sync with NODE_VERSION in netlify.toml
          cache: npm

      # npm ci installs exactly what package-lock.json lists
      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test:once

      - name: Build
        run: npm run build
