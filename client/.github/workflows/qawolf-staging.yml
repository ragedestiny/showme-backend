name: Test staging with QA Wolf

# Pull requests merge into the `staging` branch. Netlify builds that branch as
# the staging site (staging--show-me-not-tell.netlify.app, using the staging
# backend and practice database). After every merge:
#   1. wait until the staging site really serves the merged commit
#   2. tell QA Wolf, whose staging trigger then runs the regression tests.
#      QA Wolf posts the result on the commit as its own "QA Wolf Test Run"
#      and "QA Wolf Test Results" checks.
# Real users only get this version when someone runs "Promote to production",
# which first checks QA Wolf's greenlight for the commit, then moves `main`
# (the live site) to it.
on:
  push:
    branches:
      - staging
  # Adds a "Run workflow" button (Actions tab) to re-run the QA Wolf tests,
  # e.g. when a newer run replaced this commit's run before it finished
  workflow_dispatch:

# A newer merge makes testing the older one pointless
concurrency:
  group: qawolf-staging
  cancel-in-progress: true

env:
  STAGING_URL: https://staging--show-me-not-tell.netlify.app

jobs:
  test-staging:
    name: Report staging deploy to QA Wolf
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Every build writes the commit it was built from into /version.txt
      # (see vite.config.js). Testing before Netlify finishes would test the
      # previous version, so wait (up to 10 minutes) until the site serves ours.
      - name: Wait for Netlify to publish this commit on the staging site
        run: |
          for attempt in $(seq 1 60); do
            live=$(curl -fsS "$STAGING_URL/version.txt?check=$attempt" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Staging site now serves $GITHUB_SHA"
              exit 0
            fi
            echo "Staging site is not on $GITHUB_SHA yet, waiting..."
            sleep 10
          done
          echo "::error::The staging site did not publish $GITHUB_SHA within 10 minutes"
          exit 1

      - name: Tell QA Wolf the staging site was deployed
        uses: qawolf/notify-qawolf-on-deploy-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          qawolf-api-key: ${{ secrets.QAWOLF_API_KEY }}
          workspace-id: xoniuprcn2am5nh63rx8fn6cotea # not a secret
          environment: staging # the QA Wolf environment's alias
          deployment-url: ${{ env.STAGING_URL }}
