name: Promote to production
# Shown in the list of runs. The commit at the top of a run's page is only the
# version of this workflow file; the run's summary box names the commit that
# is actually being promoted.
run-name: Promote ${{ inputs.commit || 'what staging runs' }} to production

# Copies the version that is on the staging site (and that QA Wolf tested)
# to the live site. Run it from the Actions tab with "Run workflow".
#
# `main` is production: the live site is Netlify's build of `main`, so
# promoting means moving `main` to the tested commit from `staging`; Netlify
# then rebuilds the live site from it. Nothing is rebuilt from new code: it
# is the same commit. Nobody pushes to `main` by hand; only this workflow.
#
# Two jobs:
#   1. "QA Wolf greenlight" checks, live, that QA Wolf greenlit this exact
#      commit on staging (completed, zero blocking bugs, not replaced)
#   2. "promote" asks for the production approval only after that passes
on:
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Leave empty to promote what is on staging now. To roll back, enter an
          earlier commit SHA from the staging branch.
        required: false
        default: ""
      skip-qawolf-check:
        description: >-
          Emergency only: promote without QA Wolf's greenlight (e.g. rolling
          back to a version QA Wolf never tested).
        type: boolean
        required: false
        default: false

# Never two promotions at once
concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  STAGING_URL: https://staging--show-me-not-tell.netlify.app
  PRODUCTION_URL: https://show-me-not-tell.netlify.app

jobs:
  greenlight:
    name: QA Wolf greenlight
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # up to 10 min for staging to catch up + 20 for QA Wolf
    outputs:
      sha: ${{ steps.pick.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to check the commit came from staging

      # What staging runs (after waiting up to 10 min for it to run the newest
      # staging commit), or the commit typed in; see the script for details
      - name: Choose the commit to promote
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
          VERSION_URL: ${{ env.STAGING_URL }}/version.txt
          VERSION_FORMAT: text
        run: bash .github/scripts/choose-commit.sh

      - name: Set Up Node.js
        if: ${{ !inputs.skip-qawolf-check }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Waits (up to 20 minutes) if QA Wolf is still testing the commit
      - name: Check QA Wolf greenlit this commit
        if: ${{ !inputs.skip-qawolf-check }}
        env:
          QAWOLF_API_KEY: ${{ secrets.QAWOLF_API_KEY }}
          SHA: ${{ steps.pick.outputs.sha }}
          WORKSPACE_ID: xoniuprcn2am5nh63rx8fn6cotea # not a secret
          STAGING_ENVIRONMENT_ID: mpfj5fxvb9okt8zi0s7upakaoenv # QA Wolf's Staging
        run: node .github/scripts/qawolf-greenlight.mjs

      - name: Warn that the QA Wolf check was skipped
        if: ${{ inputs.skip-qawolf-check }}
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: echo "::warning::Promoting $SHA WITHOUT QA Wolf's greenlight (skip-qawolf-check was ticked)"

  promote:
    needs: greenlight
    runs-on: ubuntu-24.04
    # The "production" environment (repo Settings > Environments) asks a
    # required reviewer to approve before this job starts
    environment: production
    permissions:
      contents: write # to move the main branch
    env:
      SHA: ${{ needs.greenlight.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the promoted commit must be available to push

      # --force so that rolling back to an older commit is possible
      - name: Move main (production) to that commit
        run: git push --force origin "$SHA:refs/heads/main"

      - name: Wait for Netlify to publish it on the live site
        run: |
          for attempt in $(seq 1 60); do
            live=$(curl -fsS "$PRODUCTION_URL/version.txt?check=$attempt" || true)
            if [ "$live" = "$SHA" ]; then
              echo "The live site now serves $SHA"
              echo "- ✅ The live site now serves \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Live site is not on $SHA yet, waiting..."
            sleep 10
          done
          echo "::error::The live site did not publish $SHA within 10 minutes"
          exit 1
